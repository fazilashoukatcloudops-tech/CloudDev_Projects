apiVersion: v1
kind: Service
metadata: { name: api }
spec: { selector: { app: api }, ports: [{ name: http, port: 4000, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: api
          image: documind-api:local
          imagePullPolicy: IfNotPresent
          command: [node, dist/server.js]
          ports: [{ name: http, containerPort: 4000 }]
          envFrom: [{ configMapRef: { name: documind-config } }]
          env:
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: documind-secrets, key: JWT_SECRET } } }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: documind-secrets, key: DATABASE_URL } } }
          startupProbe: { httpGet: { path: /api/v1/health, port: http }, periodSeconds: 2, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /api/v1/health/ready, port: http }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /api/v1/health, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
          volumeMounts:
            - { name: uploads, mountPath: /app/storage/uploads }
            - { name: models, mountPath: /app/.cache/models }
      volumes:
        - { name: uploads, persistentVolumeClaim: { claimName: uploads } }
        - { name: models, persistentVolumeClaim: { claimName: models } }
