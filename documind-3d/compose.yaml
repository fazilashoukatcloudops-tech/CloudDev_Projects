name: documind

x-app: &app
  build:
    context: ./apps/api
  image: documind-api:dev
  restart: unless-stopped
  profiles: ["app"]
  env_file:
    - ./apps/api/.env
  volumes:
    - uploads:/app/storage/uploads
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-documind}:${POSTGRES_PASSWORD:-documind_dev_password}@db:5432/${POSTGRES_DB:-documind}?schema=public
  REDIS_URL: redis://redis:6379
  STORAGE_DRIVER: local
  UPLOAD_DIR: /app/storage/uploads

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: ["node", "dist/server.js"]
    environment:
      <<: *app-env
      PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["node", "dist/worker/index.js"]
    environment:
      <<: *app-env
      WORKER_HEALTH_PORT: "4100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  uploads:
