apiVersion: apps/v1
kind: Deployment
metadata: { name: worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: worker
          image: documind-api:local
          imagePullPolicy: IfNotPresent
          command: [node, dist/worker/index.js]
          ports: [{ name: health, containerPort: 4100 }]
          envFrom: [{ configMapRef: { name: documind-config } }]
          env:
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: documind-secrets, key: JWT_SECRET } } }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: documind-secrets, key: DATABASE_URL } } }
          startupProbe: { httpGet: { path: /health, port: health }, periodSeconds: 3, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /health, port: health }, periodSeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 768Mi } }
          volumeMounts:
            - { name: uploads, mountPath: /app/storage/uploads }
            - { name: models, mountPath: /app/.cache/models }
      volumes:
        - { name: uploads, persistentVolumeClaim: { claimName: uploads } }
        - { name: models, persistentVolumeClaim: { claimName: models } }
