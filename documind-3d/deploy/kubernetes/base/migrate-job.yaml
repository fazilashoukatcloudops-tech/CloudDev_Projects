apiVersion: batch/v1
kind: Job
metadata: { name: migrate }
spec:
  backoffLimit: 4
  template:
    metadata: { labels: { app: migrate } }
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: [sh, -c, "until pg_isready -h db -p 5432 -U documind; do sleep 2; done"]
      containers:
        - name: migrate
          image: documind-api:local
          imagePullPolicy: IfNotPresent
          command: [npx, prisma, migrate, deploy]
          env: [{ name: DATABASE_URL, valueFrom: { secretKeyRef: { name: documind-secrets, key: DATABASE_URL } } }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
