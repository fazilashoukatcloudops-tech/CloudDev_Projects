apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
configMapGenerator:
  - name: documind-config
    behavior: merge
    literals: [CORS_ORIGIN=http://localhost:8088, COOKIE_SECURE=false, EMBEDDING_PROVIDER=hash]
patches:
  - target: { kind: Service, name: web }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
